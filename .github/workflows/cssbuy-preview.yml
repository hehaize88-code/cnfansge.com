name: CSSBuy preview
on:
  push:
    branches: [preview/cssbuyhome]
    paths: ['cssbuyhome-com/**', '.github/workflows/cssbuy-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cssbuy-preview-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cssbuyhome-com/package-lock.json
      - run: npm ci
        working-directory: cssbuyhome-com
      - run: npm run check
        working-directory: cssbuyhome-com
      - run: npm exec astro build && node scripts/build-github-preview.mjs
        working-directory: cssbuyhome-com
        env:
          SITE_ORIGIN: https://hehaize88-code.github.io/cnfansge.com
          SITE_INDEXABLE: 'false'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: cssbuyhome-com/pages-output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
